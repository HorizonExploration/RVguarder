[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-guard"
version = "0.1.0"
description = "Openclaw Guard (龙虾卫士), a non-intrusive security protection system for OpenClaw."
requires-python = ">=3.13"
authors = [
  { name = "Codex" }
]
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "python-dotenv",
  "transitions",
  "requests",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary", "sqlalchemy[asyncio]>=2.0"]
redis = ["redis>=5.0"]
test = ["httpx"]

[tool.setuptools.packages.find]
include = ["openclaw_guard*"]
